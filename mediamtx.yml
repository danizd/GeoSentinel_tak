# Configuración de MediaMTX (servidor RTSP/HLS) — ADR 0012.
#
# Lo monta el servicio `mediamtx` de docker-compose.yml en /mediamtx.yml.
# Aquí solo se declaran las claves que NO son de fábrica; el resto de
# parámetros (RTSP 8554, RTMP 1935, HLS 8888, WebRTC 8889…) se quedan como
# vienen en los defaults de la imagen.
#
# LAS CREDENCIALES NO VAN EN ESTE FICHERO (está en el repositorio): MediaMTX
# permite sobrescribir por posición los parámetros de una lista desde el
# entorno, así que el compose define
#   MTX_AUTHINTERNALUSERS_0_USER -> usuario   (takvideo)
#   MTX_AUTHINTERNALUSERS_0_PASS -> contraseña (MEDIAMTX_PASSWORD, de .env)
# Los valores de aquí son solo el respaldo si alguien arranca el contenedor sin
# esas variables: siguen exigiendo usuario y contraseña, nunca dejan el
# servidor abierto (el 8554 se publica a Internet).

# Autenticación interna (la de defecto). PUBLICAR exige credenciales; LEER es
# anónimo a propósito (ADR 0014): WinTAK/ATAK no saben mandar usuario y
# contraseña en un stream RTSP (VLC sí), así que la lectura va sin ellas y el
# secreto del feed pasa a ser la propia ruta (quien la conozca ve el vídeo).
# El índice 0 lo ocupa el usuario de PUBLICAR: el compose sobrescribe "por
# posición" (MTX_AUTHINTERNALUSERS_0_USER/_PASS), y MediaMTX fusiona los
# permisos de todos los usuarios que coinciden, así que el anónimo (índice 1)
# da lectura a cualquiera sin tocar la exigencia de credenciales al publicar.
authInternalUsers:
  - user: CAMBIA_ESTO     # índice 0: sobrescrito por MTX_AUTHINTERNALUSERS_0_USER
    pass: CAMBIA_ESTO     # sobrescrito por MTX_AUTHINTERNALUSERS_0_PASS
    ips: []               # lista vacía = cualquier IP de origen
    permissions:
      - action: publish    # publicar: OpenTAK ICU (móvil) y FFmpeg (PC)
      - action: read       # ver con credenciales: VLC, navegador (HLS)
      - action: playback   # navegación dentro del stream (HLS)
  # Lectura anónima (índice 1). `user: any` coincide con cualquiera, incluidos
  # los clientes que no mandan credenciales; `pass` vacío no se usa en ese caso.
  - user: any
    pass:
    ips: []
    permissions:
      - action: read    # ver: WinTAK, ATAK, VLC, navegador, sin credenciales

# Cualquier ruta se crea al publicar: el alias del móvil (MOVILGALICIA), webcam,
# demo… Sin esto habría que declarar cada ruta una a una.
paths:
  all_others:
